version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: property_app_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_HOST: mysql
      DATABASE_USER: ${DATABASE_USER:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-property_db}
    depends_on:
      - mysql
    command: npm run dev -- --host
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: property_mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-property_db}
    ports:
      - "3370:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
